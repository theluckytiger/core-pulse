# fail2ban filter for failed core-pulse logins.
# Copy to /etc/fail2ban/filter.d/core-pulse.conf and enable it with a jail like:
#
#   [core-pulse]
#   enabled  = true
#   backend  = systemd
#   filter   = core-pulse
#   maxretry = 5
#   findtime = 1h
#   bantime  = 1d
#   port     = http,https
#
# Behind a CDN, a firewall ban does not stop the visitor: their requests come
# from the CDN's addresses. Add the CDN's ranges to ignoreip so they are
# never banned, and rely on core-pulse's own lockout.

[Definition]
failregex = login failed for user ".*" from <HOST>(?: \(locked\))?$
journalmatch = _SYSTEMD_UNIT=core-pulse.service
